<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">RustChain Proof-of-Antiquity reward weighting</title>
  <desc id="desc">A cover graphic showing equal work feeding antiquity multipliers and relative reward shares.</desc>
  <rect width="1000" height="420" fill="#0f1419"/>
  <rect x="46" y="46" width="908" height="328" rx="28" fill="#171f27" stroke="#60a5fa" stroke-width="3"/>
  <text x="84" y="112" fill="#60a5fa" font-family="monospace" font-size="24" font-weight="700">RUSTCHAIN · PROOF OF ANTIQUITY</text>
  <text x="84" y="172" fill="#ffffff" font-family="Arial, sans-serif" font-size="40" font-weight="700">Reward weighting, modeled offline</text>
  <text x="84" y="232" fill="#cbd5e1" font-family="monospace" font-size="24">equal work</text>
  <text x="350" y="232" fill="#60a5fa" font-family="monospace" font-size="24">× antiquity multiplier</text>
  <text x="720" y="232" fill="#cbd5e1" font-family="monospace" font-size="24">→ share</text>
  <path d="M205 224 H320" stroke="#94a3b8" stroke-width="4" marker-end="url(#a)"/>
  <path d="M646 224 H700" stroke="#94a3b8" stroke-width="4" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
  <text x="84" y="300" fill="#ffffff" font-family="monospace" font-size="20">Educational model ≠ hardware attestation simulator</text>
  <text x="84" y="340" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Deterministic Python example · public source · no mining claims</text>
</svg>
